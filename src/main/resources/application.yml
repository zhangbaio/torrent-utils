torrentUtils:
  name: torrent-util
  version: 1.0.0


server:
  port: 9090

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB
      location: ${java.io.tmpdir}

app:
  # 文件夹配置
  uploadDir: uploads/
  uploadTorrentDir: uploads/torrent/
  uploadZipDir: uploads/zip/
  # 原始种子文件
  originalFileDir: 压缩种子文件/
  # 磁力链接汇总
  allFileDir: 磁力链接汇总/
  # 种子分类
  classifyFileDir: 种子分类/

  # 文件分类规则配置
  classification:
    rules:
      - name: fc2ppv
        pattern: "fc2ppv|fc2-ppv"
      - name: carib
        pattern: "加勒比|carib"
      - name: "10-mu"
        pattern: "天然素人|10-mu|10musume"
      - name: 1pondo
        pattern: "一本道|1pon"
      - name: heyzo
        pattern: "heyzo"
      - name: paco
        pattern: "paco"
      - name: kin8
        pattern: "kin8"
      - name: c0390
        pattern: "c0930"
      - name: h0930
        pattern: "h0930"
      - name: h4610
        pattern: "h4610"
      - name: AVF-PPV
        pattern: "AVF-PPV-HEY"

  # 文件清理配置
  cleanup:
    enabled: true                    # 是否启用清理任务
    cron: "0 0 * * * ?"             # 定时任务执行时间（每小时执行一次）
    delay-hours: 24                  # 文件保留多少小时后清理
    cleanup-intermediate-files: true # 是否清理中间文件（torrent、压缩包）
    cleanup-work-dir: false          # 是否清理整个工作目录
    cleanup-magnet-files: true       # 是否清理磁力链接汇总文件
